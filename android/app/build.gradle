plugins {
    id 'com.android.application'
}

def playStoreBuild = providers.gradleProperty('playStore').orElse('false').get().toBoolean()

// Firebase sem o plugin google-services: o google-services.json fica fora do
// repositório (pasta de chaves) e só os identificadores públicos entram no BuildConfig.
def firebaseConfig = [apiKey: '', appId: '', projectId: '', senderId: '']
def firebaseFile = new File(System.getenv('BIBLIA_FIREBASE_CONFIG') ?:
        rootProject.file('../../chaves-play-biblia/google-services.json').path)
if (firebaseFile.isFile()) {
    def json = new groovy.json.JsonSlurper().parse(firebaseFile)
    def client = json.client.find { it.client_info.android_client_info.package_name == 'com.audiogamesbrasil.biblia' }
    if (client) {
        firebaseConfig = [apiKey: client.api_key[0].current_key, appId: client.client_info.mobilesdk_app_id,
                          projectId: json.project_info.project_id, senderId: json.project_info.project_number]
    }
}

android {
    namespace 'com.bibliaacessivel.app'
    compileSdk 37

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        // Na Play o app é com.audiogamesbrasil.biblia; o APK de teste local mantém o pacote antigo
        // para instalar por cima da versão já presente no celular.
        applicationId playStoreBuild ? 'com.audiogamesbrasil.biblia' : 'com.bibliaacessivel.app'
        minSdk 26
        targetSdk 37
        versionCode 32
        versionName '4.9.1'
        // Só a versão da Play recebe avisos instantâneos; a de teste local segue consultando o site.
        def firebase = playStoreBuild ? firebaseConfig : [apiKey: '', appId: '', projectId: '', senderId: '']
        buildConfigField 'String', 'FIREBASE_API_KEY', "\"${firebase.apiKey}\""
        buildConfigField 'String', 'FIREBASE_APP_ID', "\"${firebase.appId}\""
        buildConfigField 'String', 'FIREBASE_PROJECT_ID', "\"${firebase.projectId}\""
        buildConfigField 'String', 'FIREBASE_SENDER_ID', "\"${firebase.senderId}\""
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    sourceSets {
        main.assets.srcDir layout.buildDirectory.dir('generated/bibleAssets').get().asFile
        test.resources.srcDir rootProject.file('../data')
    }

    signingConfigs {
        release {
            def defaultKeystore = new File(System.getProperty('user.home'), '.android/debug.keystore')
            def configuredKeystore = System.getenv('ANDROID_RELEASE_KEYSTORE')
            storeFile configuredKeystore ? file(configuredKeystore) : defaultKeystore
            storePassword System.getenv('ANDROID_RELEASE_STORE_PASSWORD') ?: 'android'
            keyAlias System.getenv('ANDROID_RELEASE_KEY_ALIAS') ?: 'androiddebugkey'
            keyPassword System.getenv('ANDROID_RELEASE_KEY_PASSWORD') ?: 'android'
        }
    }

    buildTypes {
        release {
            if (!playStoreBuild || System.getenv('ANDROID_RELEASE_KEYSTORE')) {
                signingConfig signingConfigs.release
            }
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // As bibliotecas são atualizadas junto com o SDK; o aviso de versão nova não interrompe o build.
    lint {
        disable 'GradleDependency'
    }
}

def syncSharedContent = tasks.register('syncSharedContent', Copy) {
    from rootProject.file('../data')
    include 'biblia.db', 'harpa_crista.json', 'quiz_questions.tsv', 'ai_study_topics.txt'
    from rootProject.file('..')
    include 'THIRD_PARTY_NOTICES.md'
    into layout.buildDirectory.dir('generated/bibleAssets')
}

tasks.named('preBuild').configure {
    dependsOn syncSharedContent
}

dependencies {
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.work:work-runtime:2.12.0'
    implementation 'com.google.firebase:firebase-messaging:25.0.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'org.json:json:20240303'
}
