plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bibliaacessivel.app'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.bibliaacessivel.app'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '2.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDir layout.buildDirectory.dir('generated/bibleAssets')
    }

    signingConfigs {
        release {
            def defaultKeystore = new File(System.getProperty('user.home'), '.android/debug.keystore')
            def configuredKeystore = System.getenv('ANDROID_RELEASE_KEYSTORE')
            storeFile configuredKeystore ? file(configuredKeystore) : defaultKeystore
            storePassword System.getenv('ANDROID_RELEASE_STORE_PASSWORD') ?: 'android'
            keyAlias System.getenv('ANDROID_RELEASE_KEY_ALIAS') ?: 'androiddebugkey'
            keyPassword System.getenv('ANDROID_RELEASE_KEY_PASSWORD') ?: 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    // Mantém a biblioteca FileProvider na linha compatível com compileSdk 35.
    lint {
        disable 'GradleDependency'
    }
}

def syncBibleDatabase = tasks.register('syncBibleDatabase', Copy) {
    from rootProject.file('../data/biblia.db')
    into layout.buildDirectory.dir('generated/bibleAssets')
}

tasks.named('preBuild').configure {
    dependsOn syncBibleDatabase
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    testImplementation 'junit:junit:4.13.2'
}
