plugins {
    id 'com.android.application'
}

def playStoreBuild = providers.gradleProperty('playStore').orElse('false').get().toBoolean()

android {
    namespace 'com.bibliaacessivel.app'
    compileSdk 37

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.bibliaacessivel.app'
        minSdk 26
        targetSdk 37
        versionCode 25
        versionName '4.7.0'
        buildConfigField 'boolean', 'GITHUB_UPDATES', (!playStoreBuild).toString()
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    sourceSets {
        main.manifest.srcFile playStoreBuild ? 'src/play/AndroidManifest.xml' : 'src/main/AndroidManifest.xml'
        main.assets.srcDir layout.buildDirectory.dir('generated/bibleAssets').get().asFile
        test.resources.srcDir rootProject.file('../data')
    }

    signingConfigs {
        release {
            def defaultKeystore = new File(System.getProperty('user.home'), '.android/debug.keystore')
            def configuredKeystore = System.getenv('ANDROID_RELEASE_KEYSTORE')
            storeFile configuredKeystore ? file(configuredKeystore) : defaultKeystore
            storePassword System.getenv('ANDROID_RELEASE_STORE_PASSWORD') ?: 'android'
            keyAlias System.getenv('ANDROID_RELEASE_KEY_ALIAS') ?: 'androiddebugkey'
            keyPassword System.getenv('ANDROID_RELEASE_KEY_PASSWORD') ?: 'android'
        }
    }

    buildTypes {
        release {
            if (!playStoreBuild || System.getenv('ANDROID_RELEASE_KEYSTORE')) {
                signingConfig signingConfigs.release
            }
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // As bibliotecas são atualizadas junto com o SDK; o aviso de versão nova não interrompe o build.
    lint {
        disable 'GradleDependency'
    }
}

def syncSharedContent = tasks.register('syncSharedContent', Copy) {
    from rootProject.file('../data')
    include 'biblia.db', 'harpa_crista.json', 'quiz_questions.tsv', 'ai_study_topics.txt'
    from rootProject.file('..')
    include 'THIRD_PARTY_NOTICES.md'
    into layout.buildDirectory.dir('generated/bibleAssets')
}

tasks.named('preBuild').configure {
    dependsOn syncSharedContent
}

dependencies {
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.work:work-runtime:2.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'org.json:json:20240303'
}
