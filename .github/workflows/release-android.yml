name: Publicar versão Android

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
        with:
          # O pacote legado "tools" deixou de existir; pedir somente
          # platform-tools evita que o preparador falhe antes do sdkmanager.
          packages: platform-tools

      - name: Instalar SDK utilizado
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Conferir versão da tag
        shell: pwsh
        run: |
          $declared = (Select-String -Path android/app/build.gradle -Pattern "versionName '([^']+)'").Matches[0].Groups[1].Value
          if ("android-v$declared" -ne "${{ github.ref_name }}") { throw "A tag não corresponde à versão Android $declared" }

      - name: Restaurar chave de assinatura compatível
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/biblia-android.keystore"

      - name: Testar, analisar e compilar
        working-directory: android
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ runner.temp }}/biblia-android.keystore
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintRelease assembleRelease

      - name: Conferir assinatura e preparar assets
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          CERT="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$CERT" verify --verbose --print-certs "$APK"
          FINGERPRINT=$("$CERT" verify --print-certs "$APK" | sed -n 's/.*SHA-256 digest: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$FINGERPRINT" = "99d543111b3de0a4bf7acc1f16a3760351d1827515b89b86df5c0ce815e6822a"
          cp "$APK" BibliaAcessivel-Android.apk
          sha256sum BibliaAcessivel-Android.apk > BibliaAcessivel-Android.apk.sha256

      - name: Anexar APK Android à GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            BibliaAcessivel-Android.apk
            BibliaAcessivel-Android.apk.sha256
