name: Publicar versão Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Conferir versão da tag
        shell: pwsh
        run: |
          $declared = (Select-String -Path biblia/version.py -Pattern 'APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          if ("v$declared" -ne "${{ github.ref_name }}") { throw "A tag não corresponde a APP_VERSION=$declared" }

      - name: Instalar dependências de compilação
        run: python -m pip install -r requirements-build.txt

      - name: Executar testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Gerar EXE e pacote verificado
        shell: pwsh
        run: |
          ./scripts/build_exe.ps1
          ./scripts/package_release.ps1

      - name: Anexar arquivos à GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            BibliaAcessivel.exe
            BibliaAcessivel-Windows.zip
            BibliaAcessivel-Windows.zip.sha256
